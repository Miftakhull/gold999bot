name: Gold Signal Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python src/main.py

      - name: Commit state & logs
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals_log.csv active_signals.json || true
          git diff --cached --quiet || git commit -m "log: update sinyal $(date -u +%FT%TZ)"
          git pull --rebase origin main || true
          git push
